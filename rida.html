<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration Form</h1>
        <p class="subtitle">Please fill in the details below</p>

        <form id="registrationForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3"
                    placeholder="Enter your address"></textarea>
            </div>

            <div class="form-group">
                <label for="course">Course / Program</label>

                <select id="course" name="course">
                    <option value="">Select your course</option>
                    <option value="BIT">Bachelor of Information Technology (BIT)</option>
                    <option value="BCA">Bachelor of Computer Applications (BCA)</option>
                    <option value="BSc CSIT">BSc CSIT</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="semester">Semester</label>

                <select id="semester" name="semester">
                    <option value="">Select semester</option>
                    <option value="1st">1st Semester</option>
                    <option value="2nd">2nd Semester</option>
                    <option value="3rd">3rd Semester</option>
                    <option value="4th">4th Semester</option>
                    <option value="5th">5th Semester</option>
                    <option value="6th">6th Semester</option>
                    <option value="7th">7th Semester</option>
                    <option value="8th">8th Semester</option>
                </select>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll" placeholder="Enter your roll number">
            </div>

            <div class="form-group">
                <label>Hobbies</label>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="hobbies" value="Reading">
                        Reading
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Coding">
                        Coding
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                    placeholder="Confirm your password">
            </div>

            <div class="terms">
                <label>
                    <input type="checkbox" id="terms">
                    I agree to the terms and conditions.
                </label>
            </div>

            <div id="message"></div>

            <div class="button-group">
                <button type="submit">Register</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>

        </form>

        <footer>
            <p>Student Registration Form | Created by Rida</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
